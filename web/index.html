<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seniki</title>
    <script>
      // Runs before first paint: honours a stored choice, otherwise dark.
      // Kept inline and synchronous on purpose — deferring it causes a flash.
      (function () {
        try {
          var stored = localStorage.getItem('seniki-theme')
          document.documentElement.dataset.theme =
            stored === 'light' || stored === 'dark' ? stored : 'dark'
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
